services:
  api:
    build:
      context: ./src/TalentMap.Api
    ports:
      - "13466:8080"
    environment:
      - ConnectionStrings__MongoDb=mongodb://host.docker.internal:27017
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  client:
    build:
      context: ./src/talent-map-client
    ports:
      - "13467:80"
    restart: unless-stopped
    depends_on:
      - api
